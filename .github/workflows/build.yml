name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Show Project Info
        run: |
          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          ./gradlew --version

          echo "===== PROJECT FILES ====="
          find . -maxdepth 3 -type f | sort | head -300

      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace --info

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CachetitoTV-APK
          path: app/build/outputs/apk/debug/*.apk
