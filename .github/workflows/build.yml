name: Build Android APK
on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Create local.properties and missing native files
        run: |
          touch local.properties
          mkdir -p app/src/main/cpp
          touch app/src/main/cpp/native_credentials.cpp
          touch app/src/main/cpp/credential_transform.cpp
          touch app/src/main/cpp/magis_crypto.cpp

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CachetitoTV-APK
          path: app/build/outputs/apk/debug/*.apk
