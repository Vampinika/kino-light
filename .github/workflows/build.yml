name: Build Android APK
on: 
  push:
  workflow_dispatch: # This adds a "Run workflow" button in GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle' # Speeds up future builds

      - name: Create local.properties file
        run: |
          touch local.properties
          # If the app requires specific dummy keys, they can be injected here later

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Build APK
        # Added --stacktrace so we can see the exact error if it fails
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CachetitoTV-APK
          path: app/build/outputs/apk/debug/*.apk
