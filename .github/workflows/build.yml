name: Build Android APK
on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Create Missing Files and Configurations
        run: |
          # 1. Dummy local.properties
          cat << 'EOF' > local.properties
          magis=dummy_magis
          userId=dummy_user
          userToken=dummy_token
          sn=dummy_sn
          SENTRY_DSN=https://dummy@sentry.io/12345
          EOF
          
          # 2. Dummy C++ Files
          mkdir -p app/src/main/cpp
          touch app/src/main/cpp/credential_transform.cpp
          touch app/src/main/cpp/magis_crypto.cpp
          cat << 'EOF' > app/src/main/cpp/native_credentials.cpp
          #include <jni.h>
          extern "C" JNIEXPORT jint JNICALL JNI_OnLoad(JavaVM* vm, void* reserved) {
              return JNI_VERSION_1_6;
          }
          EOF
          
          # 3. Dummy Kotlin Classes
          mkdir -p app/src/main/java/com/arkiv/player/data/credentials
          mkdir -p app/src/main/java/com/arkiv/player/data/magis
          
          cat << 'EOF' > app/src/main/java/com/arkiv/player/data/credentials/DummyCredentials.kt
          package com.arkiv.player.data.credentials
          open class RemoteCredentialsStore
          open class CredentialsActivator
          open class SeedRefresher
          EOF
          
          cat << 'EOF' > app/src/main/java/com/arkiv/player/data/magis/DummyMagis.kt
          package com.arkiv.player.data.magis
          open class MagisCredentialStore
          interface MagisPortalClientLike
          EOF

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CachetitoTV-APK
          path: app/build/outputs/apk/debug/*.apk
